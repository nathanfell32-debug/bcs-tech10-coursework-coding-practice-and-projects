<!DOCTYPE html>
<html lang="en">
    <head>
    <title>Image Gallery Challenge</title>
    <meta charset="UTF-8">
    <meta name="description" content="Image Gallery Challenge">
    <meta name="author" content="Nathan Fell">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <!-- Header section -->
        <header class="header">Image Gallery Challenge</header>

        <!-- This is the navigation section -->
         <nav class="nav-bar">

            <!-- Left side icons -->
         <div class="nav-icons">
            <i class="fa-brands fa-font-awesome"></i>
            <i class="fab fa-facebook-f"></i>
            <i class="fab fa-twitter"></i>
            <i class="fab fa-instagram"></i>
         </div>

         <!-- Middle links -->

                <ul class="nav-links">
                    <li>Home</li>
                    <li>About</li>
                    <li>Contact us</li>
                </ul>

                <!-- Right side search bar and basket -->

                <div class="nav-actions">
                    <input type="text" placeholder="search..." class="search-bar">

                    <button class="info-btn">?</button>

                    <button class="basket-btn">
                        <i class="fa-solid fa-basket-shopping"></i>
                    </button>
                    
                </div>
            </nav>


        
         <main>
              <!-- This is the main gallery section -->

        <div class="gallery">
            <img src="Images/gallery1.jpg" alt="concert">
            <img src="Images/gallery2.jpg" alt="guitarist">
            <img src="Images/gallery3.jpg" alt="guitar">
            <img src="Images/gallery4.jpg" alt="mountain view">
            <img src="Images/gallery5.jpg" alt="city skyline view">
            <img src="Images/gallery6.jpg" alt="Hilltop view">
            <img src="Images/gallery7.jpg" alt="painting a wall">
            <img src="Images/gallery8.jpg" alt="couple painting a wall">
            <img src="Images/gallery9.jpg" alt="filling a paint tray">
            <img src="Images/gallery10.jpg" alt="videogame control pad">
            <img src="Images/gallery11.jpg" alt="videogame keyboard">
            <img src="Images/gallery12.jpg" alt="videogame desktop setup">
        </div>

        <!-- Contact form section -->

        <section class="contact-section">
            <h2>Contact Us</h2>

            <form class="contact-form">

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your name">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Your email">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Write your message"></textarea>
                <button type="submit">Send message</button>
            </form>
        
        </section>
     </main>

        <!-- This is the footer section -->
         <footer>
          <div class="footer-content">
          <p>&copy; 2026 Nathans Pictures. All rights reserved.</p>
          <ul class="footer-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact us.html">contact</a></li>
         </ul>
        <p class="footer-social">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
         </p>
         </div>

         </footer>

    </body>
</html>
